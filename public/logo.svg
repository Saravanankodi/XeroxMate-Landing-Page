<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#00B4FF" />
    </linearGradient>
  </defs>

  <!-- Main Wordmark: XEROX MATE -->
  <g font-family="'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="82" letter-spacing="1">
    <!-- XEROX in Bright White -->
    <text x="24" y="80" fill="#FFFFFF">XEROX</text>
    <!-- MATE in Vivid Electric Blue -->
    <text x="312" y="80" fill="url(#blueGrad)">MATE</text>
  </g>

  <!-- Tagline Rule & Text: — YOUR PRINTING PARTNER — -->
  <!-- Left Blue Line -->
  <rect x="24" y="112" width="46" height="4.5" rx="2.25" fill="#0080FF" />

  <!-- Tagline: YOUR PRINTING PARTNER -->
  <text
    x="270"
    y="117"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
    font-weight="700"
    font-size="14.5"
    letter-spacing="9"
    fill="#F8FAFC"
  >
    YOUR PRINTING PARTNER
  </text>

  <!-- Right Blue Line -->
  <rect x="470" y="112" width="46" height="4.5" rx="2.25" fill="#0080FF" />
</svg>
